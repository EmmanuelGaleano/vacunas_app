# =============================================================================
# nginx.conf - servidor web del contenedor "vacunas-web"
# =============================================================================
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # 1. Proxy hacia la API MyVaccine (contenedor del profesor, puerto 38791).
    #    La app web llama a http://localhost:8080/api/... y nginx reenvía la
    #    petición a la API. Como el navegador cree que todo viene del mismo
    #    sitio, se evita el error de CORS (la API no tiene CORS configurado).
    #    host.docker.internal = el computador anfitrión, visto desde Docker.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://host.docker.internal:38791;
    }

    # -------------------------------------------------------------------------
    # 2. Rutas de GoRouter.
    #    Si se recarga la página en /vacunas/3, ese archivo no existe en el
    #    servidor. try_files devuelve index.html y GoRouter, ya dentro de la
    #    app, lee la URL y muestra la pantalla correcta.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
